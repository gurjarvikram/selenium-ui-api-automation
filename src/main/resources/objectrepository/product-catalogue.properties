# Product grid.
productCard   = css:.mb-3
productTitle  = css:b
addToCart     = css:.card-body button:last-of-type

# Add-to-cart button of one named card. %s is the product title.
# Targeting the button directly means the click can be retried against a stable locator
# instead of a WebElement that goes stale when Angular re-renders the grid.
addToCartFor = xpath:(//div[contains(@class,'card-body')][.//b[normalize-space()='%s']]//button)[last()]
