# Non-secret configuration only.
# Every key can be overridden with -Dkey=value or an upper-cased env var (UI_BASE_URL).
# Credentials are read from the environment instead -- see .env.example.

ui.base.url = https://rahulshettyacademy.com/client/
api.base.url = https://rahulshettyacademy.com

browser = chrome
headless = false

# Point at a Selenium Grid to run the same suites remotely, e.g. http://localhost:4444
grid.url =

timeout.implicit.seconds = 10
retry.count = 1

# Request/response logging. Off by default: it prints the login payload and bearer
# token in plaintext. Turn on only when debugging a call.
api.log.requests = false
