# Shared defaults. Anything that differs per deployment belongs in env-{name}.properties.
# Every key can be overridden with -Dkey=value or an upper-cased env var (BROWSER=firefox).
# Credentials are never stored here -- see .env.example.

browser = chrome
headless = false

# Point at a Selenium Grid to run the same suites remotely, e.g. http://localhost:4444
grid.url =

timeout.explicit.seconds = 15
timeout.pageload.seconds = 30
retry.count = 1

# Request/response logging. Off by default: it prints the login payload and bearer
# token in plaintext. Turn on only when debugging a call.
api.log.requests = false
