name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly canary against the live demo environment: the demo site changing under
    # the suite is the failure this catches, and it catches it without a push.
    - cron: '0 2 * * *'

env:
  ECOM_USER_EMAIL: ${{ secrets.ECOM_USER_EMAIL }}
  ECOM_USER_PASSWORD: ${{ secrets.ECOM_USER_PASSWORD }}
  # Repository variables, not secrets: a target URL is configuration, and keeping it out
  # of the secret store means it stays readable in the logs where it is useful. Unset is
  # the normal case -- ConfigManager treats a blank value as absent and falls through to
  # env-demo.properties, so these only matter when pointing CI at another deployment.
  UI_BASE_URL: ${{ vars.UI_BASE_URL }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}

# One CI run at a time, repository-wide.
#
# Every suite authenticates as the same account, and that account has a single
# server-side cart. Two runs overlapping -- two pull requests, or a push landing during
# the nightly -- check out and empty each other's carts, which surfaces as an unrelated
# "cart is empty" assertion failure. Queueing rather than cancelling keeps every commit
# tested; the trade is that a second run waits a couple of minutes.
concurrency:
  group: ci-shared-account
  cancel-in-progress: false

jobs:
  # Static analysis gate. Runs first and blocks everything else, so a style or
  # anti-pattern regression never reaches the point of spending browser minutes.
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Checkstyle and enforcer
        run: mvn -B checkstyle:check enforcer:enforce

  # Fast gate: no browser, so it finishes in seconds and catches contract breaks early.
  api:
    name: API contracts
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run API suite
        run: mvn -B -P api test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-report
          path: target/reports/
          retention-days: 3

  # The only browser job CI runs: one representative journey per layer, on one browser.
  # The wider journeys stay in `mvn -P regression`, run locally or on demand, rather than
  # spending browser minutes on every push to re-prove the same page objects.
  smoke:
    name: Smoke on chrome
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run smoke suite
        run: mvn -B -P smoke test -Dbrowser=chrome -Dheadless=true
      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: target/reports/
          retention-days: 3
