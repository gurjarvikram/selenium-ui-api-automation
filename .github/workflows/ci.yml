name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly regression against the live demo environment.
    - cron: '0 2 * * *'

env:
  ECOM_USER_EMAIL: ${{ secrets.ECOM_USER_EMAIL }}
  ECOM_USER_PASSWORD: ${{ secrets.ECOM_USER_PASSWORD }}

jobs:
  # Fast gate: no browser, so it finishes in seconds and catches contract breaks early.
  api:
    name: API contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run API suite
        run: mvn -B -P api test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report
          path: target/reports/
          retention-days: 7

  # UI and hybrid run only once the API gate is green.
  browser:
    name: ${{ matrix.suite }} on ${{ matrix.browser }}
    needs: api
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ui, hybrid]
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run ${{ matrix.suite }} suite
        run: mvn -B -P ${{ matrix.suite }} test -Dbrowser=${{ matrix.browser }} -Dheadless=true
      - name: Upload report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-${{ matrix.browser }}-report
          path: target/reports/
          retention-days: 7
