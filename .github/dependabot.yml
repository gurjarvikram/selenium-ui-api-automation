# Keeps the toolchain current. The versions this framework inherited were roughly two
# years behind, which is exactly what this is meant to prevent recurring.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      selenium:
        patterns: ["org.seleniumhq.selenium:*"]
      test-tooling:
        patterns: ["org.testng:*", "io.rest-assured:*", "org.assertj:*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
